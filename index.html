<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Minimalist Timer & Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Prevents scrollbars completely */
      background-color: #000000;
      color: #ffffff;
      font-family: monospace;
      user-select: none;
    }

    /* Container layout */
    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Top Right Controls */
    .top-right-controls {
      position: absolute;
      top: 25px;
      right: 30px;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .fullscreen-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #888888;
      font-size: 1.2rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: scale(1.05);
    }

    /* Center Timer Block */
    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 400;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    /* Auto-hiding control panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      transition: opacity 0.5s ease;
    }

    .time-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-input-group input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      width: 140px;
      text-align: center;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .time-input-group input:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    .time-input-group input::placeholder {
      color: #666666;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button.btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button.btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    button.btn-primary {
      background: #ffffff;
      color: #000000;
      border: none;
      font-weight: 600;
    }

    button.btn-primary:hover {
      background: #e0e0e0;
    }

    /* Bottom Left: Live Clock (Time Only) */
    .bottom-left-clock {
      position: absolute;
      bottom: 25px;
      left: 30px;
      font-size: 0.85rem;
      color: #888888;
      letter-spacing: 0.5px;
    }

    /* Bottom Right: Date Display */
    .bottom-right-date {
      position: absolute;
      bottom: 25px;
      right: 30px;
      font-size: 0.85rem;
      color: #888888;
      letter-spacing: 0.5px;
    }

    /* Auto-hide class applied by JavaScript */
    .fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    
    <!-- Top Right: Fullscreen Toggle -->
    <div class="top-right-controls auto-hide" id="topRightControls">
      <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
    </div>

    <!-- Center: Customizable Timer -->
    <div class="timer-container">
      <div class="timer-display" id="timerDisplay">10:00</div>

      <div class="controls-panel auto-hide" id="controlsPanel">
        <!-- Flexible Time Text Input -->
        <div class="time-input-group">
          <input type="text" id="timeInput" placeholder="e.g. 1h30m" autocomplete="off" spellcheck="false" />
          <button class="btn" onclick="applyTimeInput()">Set</button>
        </div>

        <!-- Timer Controls -->
        <div class="action-buttons">
          <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Start</button>
          <button class="btn" onclick="resetTimer()">Reset</button>
        </div>
      </div>
    </div>

    <!-- Bottom Left: Live Clock (Time Only) -->
    <div class="bottom-left-clock" id="liveClock">--:--</div>

    <!-- Bottom Right: Live Date -->
    <div class="bottom-right-date" id="liveDate">-/-/----</div>

  </div>

  <script>
    // --- Clock and Date Logic ---
    function updateClockAndDate() {
      const now = new Date();

      // Time Only: "11:33"
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('liveClock').textContent = `${hours}:${minutes}`;

      // Date Format: "7/10/2026"
      const day = now.getDate();
      const monthPadded = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      document.getElementById('liveDate').textContent = `${day}/${monthPadded}/${year}`;
    }

    updateClockAndDate();
    setInterval(updateClockAndDate, 1000);


    // --- Flexible Time Parsing Logic ---
    function parseTimeString(inputStr) {
      if (!inputStr) return null;
      const str = inputStr.trim().toLowerCase();

      // If user inputs a plain number (e.g. "10" or "45"), treat as minutes
      if (/^\d+(\.\d+)?$/.test(str)) {
        return Math.round(parseFloat(str) * 60);
      }

      let totalSeconds = 0;
      let matched = false;

      // Extract hours (e.g., 1h, 1.5h, 2hr, 2hours)
      const hoursMatch = str.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)/);
      if (hoursMatch) {
        totalSeconds += parseFloat(hoursMatch[1]) * 3600;
        matched = true;
      }

      // Extract minutes (e.g., 30m, 30min, 30mins)
      const minsMatch = str.match(/(\d+(?:\.\d+)?)\s*(?:m|min|mins|minute|minutes)/);
      if (minsMatch) {
        totalSeconds += parseFloat(minsMatch[1]) * 60;
        matched = true;
      }

      // Extract seconds (e.g., 45s, 45sec, 45secs)
      const secsMatch = str.match(/(\d+(?:\.\d+)?)\s*(?:s|sec|secs|second|seconds)/);
      if (secsMatch) {
        totalSeconds += parseFloat(secsMatch[1]);
        matched = true;
      }

      return matched && totalSeconds > 0 ? Math.round(totalSeconds) : null;
    }


    // --- Timer Logic ---
    let initialSeconds = 600; // Default 10 minutes
    let remainingSeconds = 600;
    let timerInterval = null;
    let isRunning = false;

    const timerDisplay = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startBtn');
    const timeInput = document.getElementById('timeInput');

    function renderTimer() {
      const hrs = Math.floor(remainingSeconds / 3600);
      const mins = Math.floor((remainingSeconds % 3600) / 60);
      const secs = remainingSeconds % 60;

      if (hrs > 0) {
        timerDisplay.textContent = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      } else {
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
    }

    function applyTimeInput() {
      const parsedSecs = parseTimeString(timeInput.value);
      if (parsedSecs && parsedSecs > 0) {
        pauseTimer();
        initialSeconds = parsedSecs;
        remainingSeconds = initialSeconds;
        renderTimer();
        timeInput.value = '';
        timeInput.blur();
      } else {
        // Simple shake / focus visual indication if input couldn't be parsed
        timeInput.style.borderColor = '#ff5555';
        setTimeout(() => { timeInput.style.borderColor = ''; }, 1000);
      }
    }

    // Allow hitting Enter in input field
    timeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        applyTimeInput();
      }
    });

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      isRunning = true;
      startBtn.textContent = 'Pause';
      timerInterval = setInterval(() => {
        remainingSeconds--;
        renderTimer();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      startBtn.textContent = 'Start';
      if (timerInterval) clearInterval(timerInterval);
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = initialSeconds;
      renderTimer();
    }

    renderTimer();


    // --- Auto-Hide UI Controls Logic ---
    let idleTimeout = null;
    const autoHideElements = document.querySelectorAll('.auto-hide');

    function showControls() {
      autoHideElements.forEach(el => el.classList.remove('fade-out'));
      clearTimeout(idleTimeout);
      
      // Do not auto-hide while typing in the input box
      if (document.activeElement === timeInput) return;

      idleTimeout = setTimeout(() => {
        autoHideElements.forEach(el => el.classList.add('fade-out'));
      }, 3000);
    }

    document.addEventListener('mousemove', showControls);
    document.addEventListener('touchstart', showControls);
    document.addEventListener('keydown', showControls);
    timeInput.addEventListener('focus', () => clearTimeout(idleTimeout));
    timeInput.addEventListener('blur', showControls);
    showControls();


    // --- Fullscreen API Logic ---
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    function updateFullscreenButton() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        fullscreenBtn.textContent = '✕';
      } else {
        fullscreenBtn.textContent = '⛶';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
  </script>
</body>
</html>
