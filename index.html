<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Minimalist Timer & Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Prevents scrollbars completely */
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Container layout */
    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Top Right Controls */
    .top-right-controls {
      position: absolute;
      top: 25px;
      right: 30px;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .fullscreen-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #888888;
      font-size: 1.2rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: scale(1.05);
    }

    /* Center Timer Block */
    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 200;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 20px;
    }

    /* Auto-hiding control panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      transition: opacity 0.5s ease;
    }

    .preset-buttons, .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button.btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    button.btn-primary {
      background: #ffffff;
      color: #000000;
      border: none;
      font-weight: 600;
    }

    button.btn-primary:hover {
      background: #e0e0e0;
    }

    .custom-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .custom-input-group input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 12px;
      width: 70px;
      text-align: center;
      font-size: 0.9rem;
      outline: none;
    }

    /* Bottom Left: Clock Display */
    .bottom-left-clock {
      position: absolute;
      bottom: 25px;
      left: 30px;
      font-size: 0.85rem;
      color: #888888;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* Bottom Right: Date Display */
    .bottom-right-date {
      position: absolute;
      bottom: 25px;
      right: 30px;
      font-size: 0.85rem;
      color: #888888;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* Auto-hide class applied by JavaScript */
    .fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    
    <!-- Top Right: Fullscreen Toggle -->
    <div class="top-right-controls auto-hide" id="topRightControls">
      <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
    </div>

    <!-- Center: Customizable Timer -->
    <div class="timer-container">
      <div class="timer-display" id="timerDisplay">10:00</div>

      <div class="controls-panel auto-hide" id="controlsPanel">
        <!-- Preset Timers -->
        <div class="preset-buttons">
          <button class="btn" onclick="setTimer(5)">5m</button>
          <button class="btn" onclick="setTimer(10)">10m</button>
          <button class="btn" onclick="setTimer(25)">25m</button>
          <div class="custom-input-group">
            <input type="number" id="customMin" min="1" max="999" placeholder="Min" />
            <button class="btn" onclick="setCustomTimer()">Set</button>
          </div>
        </div>

        <!-- Timer Controls -->
        <div class="action-buttons">
          <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Start</button>
          <button class="btn" onclick="resetTimer()">Reset</button>
        </div>
      </div>
    </div>

    <!-- Bottom Left: Live Clock -->
    <div class="bottom-left-clock" id="liveClock">--:-- ----------, - --------</div>

    <!-- Bottom Right: Live Date -->
    <div class="bottom-right-date" id="liveDate">--/--/----</div>

  </div>

  <script>
    // --- Clock and Date Logic ---
    function updateClockAndDate() {
      const now = new Date();

      // Format Time: "11:21 Wednesday, 7 October"
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const weekday = now.toLocaleDateString('en-GB', { weekday: 'long' });
      const day = now.getDate();
      const month = now.toLocaleDateString('en-GB', { month: 'long' });

      const clockString = `${hours}:${minutes} ${weekday}, ${day} ${month}`;
      document.getElementById('liveClock').textContent = clockString;

      // Format Date: "07/10/2026"
      const dayPadded = String(day).padStart(2, '0');
      const monthPadded = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      const dateString = `${dayPadded}/${monthPadded}/${year}`;
      document.getElementById('liveDate').textContent = dateString;
    }

    updateClockAndDate();
    setInterval(updateClockAndDate, 1000);


    // --- Customizable Timer Logic ---
    let initialSeconds = 600; // Default 10 minutes
    let remainingSeconds = 600;
    let timerInterval = null;
    let isRunning = false;

    const timerDisplay = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startBtn');

    function renderTimer() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function setTimer(minutes) {
      pauseTimer();
      initialSeconds = minutes * 60;
      remainingSeconds = initialSeconds;
      renderTimer();
    }

    function setCustomTimer() {
      const val = parseInt(document.getElementById('customMin').value);
      if (val && val > 0) {
        setTimer(val);
        document.getElementById('customMin').value = '';
      }
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      isRunning = true;
      startBtn.textContent = 'Pause';
      timerInterval = setInterval(() => {
        remainingSeconds--;
        renderTimer();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      startBtn.textContent = 'Start';
      if (timerInterval) clearInterval(timerInterval);
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = initialSeconds;
      renderTimer();
    }

    renderTimer();


    // --- Auto-Hide UI Controls Logic ---
    let idleTimeout = null;
    const autoHideElements = document.querySelectorAll('.auto-hide');

    function showControls() {
      autoHideElements.forEach(el => el.classList.remove('fade-out'));
      clearTimeout(idleTimeout);
      idleTimeout = setTimeout(() => {
        autoHideElements.forEach(el => el.classList.add('fade-out'));
      }, 3000); // Hides after 3 seconds of inactivity
    }

    document.addEventListener('mousemove', showControls);
    document.addEventListener('touchstart', showControls);
    document.addEventListener('keydown', showControls);
    showControls();


    // --- Fullscreen API Logic ---
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    function updateFullscreenButton() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        fullscreenBtn.textContent = '✕';
      } else {
        fullscreenBtn.textContent = '⛶';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
  </script>
</body>
</html>
